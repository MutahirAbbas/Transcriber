# Final-expense sales call scorecard.
# This is a STARTER. The real one comes from Leo / the top closers — replace freely.
# Each category: label, weight (sums to 100) and what a 10 vs a 3 looks like.
version: 5
target_score: 60

categories:
  opening:
    label: Opening
    weight: 15
    description: >
      Agent introduces self and company clearly, states the reason for the call,
      confirms they're speaking to the right person, sets a friendly tone within
      the first 30 seconds.
  discovery:
    label: Discovery
    weight: 20
    description: >
      Agent asks about the customer's situation before pitching: age, health,
      existing coverage, who they want to protect, budget. Listens more than talks
      in this phase.
  value_presentation:
    label: Value
    weight: 20
    description: >
      Agent ties the product to what the customer said they care about (funeral
      costs, not burdening family). Explains coverage amount, premium, and type
      (level / graded / guaranteed issue) in plain language.
  objection_handling:
    label: Objections
    weight: 20
    description: >
      Agent acknowledges objections (price, "need to think", "talk to my spouse",
      "already have coverage") without arguing, isolates the real concern, and
      responds with relevant information or reassurance.
  compliance:
    label: Compliance
    weight: 15
    description: >
      Agent states the call is recorded, confirms consent, does not misrepresent
      the product, does not pressure or use fear tactics, discloses carrier and
      licensed-agent status where required.
  close:
    label: Close
    weight: 10
    description: >
      Agent asks for the sale or next concrete step, handles the application /
      enrollment handoff smoothly, confirms details back to the customer.

# The ONLY flags the scorer may raise. Anything else is dropped after it answers.
flag_types:
  # "No recording disclosure" and "No licensed-agent statement" are not flags for now: on the first
  # five real calls both fired every time, and the notice may be given before the call reaches the
  # closer. The two phrases are still reported below, so the facts are kept; they raise nothing.
  - {id: approval_before_uw,        label: "Approval promised before underwriting", severity: critical}
  - {id: agent_handled_esign,       label: "Agent handled the customer's e-signature or code", severity: critical}
  - {id: ignored_end_request,       label: "Continued after a request to end the call", severity: critical}
  - {id: carrier_after_payment,     label: "Carrier named after payment data",     severity: major}
  - {id: health_answer_prejudged,   label: "Health answer pre-judged or misrecorded", severity: major}
  - {id: pressure_tactics,          label: "Fear, shame or pressure tactics",      severity: major}

# The ONLY habits the scorer may name on a "coach" finding. `label` is what the agent reads.
# `try` is the approved line the agent is shown (never written by the model); `try_es` its
# Spanish. DRAFTS: Leo rewrites the lines. No line may make a claim about a product.
# `other` is for anything else worth a manager's eye: it is never counted as a habit.
coach_types:
  - {id: slow_opening,              category: opening,            label: "Say who you are and why you are calling in the first 30 seconds"}
  - {id: no_right_person_check,     category: opening,            label: "Check you are speaking to the right person"}
  - {id: quoted_before_budget,      category: discovery,          label: "Ask about budget before you quote",
     try: "Before I show you plans, what would feel comfortable each month?"}
  - {id: skipped_existing_coverage, category: discovery,          label: "Ask what coverage they already have",
     try: "Do you have any life insurance in place today?"}
  - {id: skipped_who_to_protect,    category: discovery,          label: "Ask who they want to protect",
     try: "Who would be handling things for you when the time comes?"}
  - {id: talked_over_customer,      category: discovery,          label: "Let the customer finish before you answer"}
  - {id: plan_not_tied_to_need,     category: value_presentation, label: "Tie the plan to what the customer told you"}
  - {id: plan_type_unclear,         category: value_presentation, label: "Say the plan type and any waiting period in plain words"}
  - {id: dodged_price_question,     category: objection_handling, label: "Answer the price question directly"}
  - {id: argued_with_objection,     category: objection_handling, label: "Acknowledge the concern before you answer it",
     try: "That makes sense. Can I ask what part worries you most?"}
  - {id: spouse_not_offered_3way,   category: objection_handling, label: "Offer a three-way call when a spouse is mentioned",
     try: "Would it help to get them on the line with us now?"}
  - {id: callback_without_time,     category: close,              label: "Give every callback a day and a time",
     try: "Does Thursday at 4 work, or is Friday morning better?"}
  - {id: no_ask_for_sale,           category: close,              label: "Ask for the next step",
     try: "Shall we get the application started?"}
  - {id: details_not_read_back,     category: close,              label: "Read the details back before you finish",
     try: "Let me read that back to make sure I have it right."}
  - {id: other,                     category: general,            label: "Something else worth coaching"}

# Asked only about calls that ended in a sale: facts about the sale that may tell whether the
# customer keeps the policy. The scorer answers yes / no / unclear for each and never predicts;
# what these answers mean is worked out later from what really happened to each policy.
retention_signals:
  - {id: confirmed_amount,      label: "The customer repeated or confirmed the monthly amount"}
  - {id: said_affordable,       label: "The customer said the amount is comfortable"}
  - {id: hesitated_on_price,    label: "The customer hesitated or pushed back on the price"}
  - {id: draft_date_fits_income, label: "The draft date was tied to when their income arrives"}
  - {id: knows_carrier,         label: "The customer was told the carrier's name and acknowledged it"}
  - {id: knows_coverage_start,  label: "The customer was told when coverage starts and about any waiting period"}
  - {id: family_involved,       label: "A spouse or family member took part or was named as a decision maker"}
  - {id: replacing_coverage,    label: "Existing coverage is being replaced"}
  - {id: unsure_at_close,       label: "The customer sounded unsure or rushed at the close"}
  - {id: details_read_back,     label: "The agent read the details back before finishing"}

# Reported on every call: said or not, and when. A phrase with a `flag` raises it when missing;
# one without only reports.
required_phrases:
  - {phrase: "recorded line",  before_personal_data: true}
  - {phrase: "licensed agent", before_personal_data: true}

# Order of the phase bar; each maps to the category its label shows.
phases:
  - {id: opening,     label: "Opening",     category: opening}
  - {id: discovery,   label: "Discovery",   category: discovery}
  - {id: value,       label: "Value",       category: value_presentation}
  - {id: application, label: "Application", category: compliance}
  - {id: objections,  label: "Objections",  category: objection_handling}
  - {id: close,       label: "Close",       category: close}

compliance_cap: {if_any: critical, max_score: 3}
